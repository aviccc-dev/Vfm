<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="vfm-plugin" content="עורך אינטראקטיבי">
<meta name="vfm-plugin-version" content="10">
<meta name="vfm-lab" content="עורך אינטראקטיבי">
<meta name="vfm-lab-version" content="10">
<title>עורך אינטראקטיבי</title>
<style>
/* גרסה 10 — גרסת בדיקה לעיצוב (claude/orech-itzuvim.md): הראש בשורה אחת (☰ הקובץ · ביטול/חזרה · הרצה), תפריט קובץ אחד,
   פס פעולות בשורה הפתוחה (הזזה, שכפול, הוספה, מחיקה), * ? % צמודים לתחתית, ופתיחה לפי תיקיות.
   תוסף "עורך אינטראקטיבי": העורך החדש על קובצי הפקודות האמיתיים. הצבעים — מהתוכנה (vfm.theme), כאן רק ברירת מחדל.
   vfm-lab — כדי שגם הגרסה המותקנת (מ0.39, "הוסף מעבדה") תכיר את העמוד; מ0.40 — vfm-plugin, בתיקיית "תוספים" */
:root{
  --bg:#FFFFFF; --soft:#F4F5F6; --fg:#202124; --muted:#5F6368; --ghost:#9AA0A6; --chip:#E8F0FE; --chip-fg:#174EA6;
  --accent:#1A73E8; --err:#C5221F; --rule:#E0E0E0; --act:#F4F5F6; --on:#FFFFFF; --shade:rgba(32,33,36,.38);
  --f:system-ui,"Roboto","Noto Sans Hebrew",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.5}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:5;background:var(--soft);border-bottom:1px solid var(--rule)}
.bar{display:flex;gap:6px;align-items:center;padding:8px 12px 4px}
.bar .name{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:inherit;font-weight:600;text-align:start;padding:6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.bar .name small{color:var(--muted);font-weight:400}
.btn{font:inherit;font-size:.92rem;border-radius:8px;border:1px solid var(--rule);background:var(--bg);color:var(--fg);padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on)}
.btn.main.real{background:var(--err);border-color:var(--err)}
.btn:disabled{opacity:.45;cursor:default}
.bar2{display:flex;flex-wrap:wrap;gap:6px 10px;padding:2px 12px 8px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:.8rem;border:0;background:var(--bg);color:var(--muted);padding:3px 9px;cursor:pointer}
.seg button+button{border-inline-start:1px solid var(--rule)}
.seg button.on{background:var(--chip);color:var(--chip-fg);font-weight:600}
.seg.run button.on[data-v="real"]{background:var(--err);color:var(--on)}
#ed{padding:5px 8px;background:var(--soft)}
.rw{position:relative;padding:3px 0}
.row{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;background:var(--bg);border:1px solid var(--rule);border-radius:8px;cursor:pointer}
.row.on{border-color:var(--accent);cursor:default}
.gbar{flex:none;width:4px;align-self:stretch;border-radius:2px}
.gl{position:absolute;top:0;bottom:0;width:4px;border-radius:2px}
.gdot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:8px;vertical-align:middle}
.num{flex:none;width:1.5em;color:var(--ghost);font-size:.78rem;padding-top:.35em;text-align:center;font-variant-numeric:tabular-nums}
.body{flex:1;min-width:0}
.ln{white-space:pre-wrap;word-break:break-word;min-height:1.5em}
.ln .w{font-weight:700}
.ln .lk{color:var(--muted)}
.ln .dt{color:var(--accent)}
.ln.raw{color:var(--muted)}
.tagl{display:inline-block;font-size:.72rem;color:var(--muted);border:1px solid var(--rule);border-radius:5px;padding:0 5px;margin-inline-start:6px;vertical-align:middle}
.miss{color:var(--err);font-size:.8rem}
.flow{display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:2px 0}
.unit{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-width:0}
.unit.wr{flex-wrap:wrap;align-self:stretch}
.link{color:var(--muted);font-weight:600;min-width:1.4em}
.what{font-size:.8rem;color:var(--muted);margin-top:3px}
.chip{font:inherit;border-radius:7px;padding:4px 10px;border:1px solid transparent;cursor:pointer;line-height:1.45;max-width:100%;text-align:start;word-break:break-word}
.chip.cmd{font-weight:700;background:var(--bg);border-color:var(--rule);color:var(--fg)}
.chip.val{background:var(--chip);color:var(--fg)}
.chip.val .kl{color:var(--muted);font-size:.8em;margin-inline-end:5px}
.chip.btn2{background:var(--chip);color:var(--chip-fg);font-size:.9em}
.chip.dim{background:transparent;color:var(--ghost);border:1px dashed var(--rule);cursor:default;font-size:.9em}
.chip.det{background:transparent;color:var(--accent);border-color:var(--chip)}
.fi{font:inherit;font-size:16px;border:0;border-bottom:1.5px solid var(--accent);background:transparent;color:var(--fg);padding:3px 3px;min-width:4.5em;max-width:100%;outline:none;border-radius:0}
.fi::placeholder{color:var(--ghost)}
.fi.err{border-bottom-color:var(--err);color:var(--err)}
.fi.wide{flex:1;min-width:8em}
.fi:disabled{border-bottom-style:dashed;border-bottom-color:var(--rule)}
#plain{display:block;width:100%;min-height:65vh;border:0;outline:none;resize:vertical;padding:10px 12px;background:var(--bg);color:var(--fg);
  font:inherit;font-size:16px;line-height:1.7;direction:rtl;unicode-bidi:plaintext;text-align:start}
.keys{display:flex;gap:6px;padding:8px 12px 0;flex-wrap:wrap}
.key{font:inherit;min-width:2.6em;padding:5px 10px;border-radius:7px;border:1px solid var(--rule);background:var(--bg);color:var(--fg);cursor:pointer}
.key small{color:var(--muted);font-size:.75em}
.addrow{padding:10px 12px}
.ghostbtn{background:transparent;border:1px dashed var(--rule);color:var(--muted);border-radius:8px;padding:7px 12px;font:inherit;font-size:.92rem;cursor:pointer}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
.shade{position:fixed;inset:0;background:var(--shade);z-index:20}
.sheet{position:fixed;inset:auto 0 0 0;z-index:21;background:var(--bg);border-radius:14px 14px 0 0;max-height:82vh;overflow:auto;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.18)}
.in{display:flex;flex-direction:column;gap:10px}
.sh-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sh-title{font-weight:700;font-size:1.05rem}
.x{background:transparent;border:0;color:var(--accent);font:inherit;padding:6px 8px;cursor:pointer}
.crumb{color:var(--muted);font-size:.88rem}
.items{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;background:transparent;border:0;border-bottom:1px solid var(--rule);color:var(--fg);font:inherit;text-align:start;cursor:pointer}
.it.on{background:var(--chip);color:var(--chip-fg);font-weight:600}
.it:last-child{border-bottom:0}
.it .k{color:var(--muted);font-size:.85rem;text-align:end}
.it[aria-checked="true"] .k{color:var(--accent);font-weight:700}
.it.danger{color:var(--err)}
.grp{font-size:.8rem;color:var(--muted);margin-top:4px}
.mask,.vrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mask .fi,.vrow .fi{flex:1;min-width:6em}
.primary{background:var(--accent);color:var(--on);border:0;border-radius:10px;padding:12px;font:inherit;font-weight:600;cursor:pointer}
.secondary{background:transparent;color:var(--fg);border:1px solid var(--rule);border-radius:10px;padding:11px;font:inherit;cursor:pointer}
.pre{white-space:pre-wrap;word-break:break-word;background:var(--soft);border-radius:8px;padding:8px 10px;font-size:.92rem}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:30;text-align:center}
button:focus-visible,.fi:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{padding:8px 10px}
.bar .name{display:flex;align-items:center;gap:6px;min-height:40px}
.bar .name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .name .hb{flex:none;color:var(--muted);font-weight:400}
.bar .name .dot{flex:none;color:var(--err);font-size:.75rem}
.pair{display:inline-flex;flex:none}
.pair .btn{border-radius:0;min-width:40px;min-height:40px;padding:6px 9px;display:inline-flex;align-items:center;justify-content:center}
.pair .btn:first-child{border-start-start-radius:8px;border-end-start-radius:8px}
.pair .btn:last-child{border-start-end-radius:8px;border-end-end-radius:8px}
.pair .btn+.btn{border-inline-start-width:0}
.pair .btn.main+.btn.main{border-inline-start:1px solid rgba(255,255,255,.4);padding:6px 7px;min-width:30px}
.pair svg{width:20px;height:20px}
.lnact{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--rule)}
.la{font:inherit;font-size:.85rem;min-width:40px;min-height:38px;padding:4px 9px;border-radius:8px;border:1px solid var(--rule);background:var(--bg);color:var(--fg);cursor:pointer}
.la.danger{color:var(--err);margin-inline-start:auto}
.keys{position:sticky;bottom:0;z-index:4;background:var(--soft);border-top:1px solid var(--rule);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.key{min-height:40px}
.it .sub{display:block;color:var(--muted);font-size:.78rem;font-weight:400}
.status{font-size:.82rem;color:var(--muted)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--rule)}
.mrow:last-child{border-bottom:0}
.mrow .seg button{min-height:34px;font-size:.88rem}
.toast{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <button class="name" id="fname" type="button" aria-label="תפריט הקובץ"></button>
    <span class="pair"><button class="btn" id="undo" type="button" aria-label="ביטול פעולה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l4-4-4-4"/><path d="M19 10H8a4 4 0 1 0 0 8h1"/></svg></button><button class="btn" id="redo" type="button" aria-label="חזרה על פעולה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14l-4-4 4-4"/><path d="M5 10h11a4 4 0 1 1 0 8h-1"/></svg></button></span>
    <span class="pair"><button class="btn main" id="run" type="button">▶ בכאילו</button><button class="btn main" id="runMode" type="button" aria-label="הרצה אמיתית או בכאילו">▾</button></span>
  </div>
</div>
<div id="ed"></div>
<textarea id="plain" hidden spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" aria-label="הקובץ כטקסט"></textarea>
<div class="keys" id="keys" hidden>
  <button class="key" type="button" data-k="*">* <small>כל שם</small></button>
  <button class="key" type="button" data-k="?">? <small>תו אחד</small></button>
  <button class="key" type="button" data-k="%">% <small>משתנה</small></button>
</div>
<div class="addrow" id="addrow" hidden><button class="ghostbtn" id="add" type="button">+ שורה בסוף</button></div>
<div class="shade" id="shade" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="in" id="sheetIn"></div></div>

<script id="model">
/* ===== המודל: כל הפקודות שהמנוע מכיר, ואיך שורה נקראת ונכתבת. בלי מסך — נבדק גם מחוץ לדפדפן ===== */
window.VfmEditorModel=(function(){
"use strict";
// מ0.40 התוכנה מכירה "תוסף" (הוסף תוסף, פתח תוסף…); הגרסה הקודמת — "מעבדה". העמוד בודק בהתחלה, וכותב מה שהמנוע המותקן מכיר
const compat={plugins:true};
const q=s=>'"'+s+'"';
const qv=v=>/[\s"]/.test(v)||v===''?q(v):v;
// מילות הסוג של מנוע הרשימות
const W={MAN:'ידנית',SM:'חכמה',CONT:'תוכן',FILES:'קבצי',FILE:'קובץ',DIR:'תיקייה'};
const LIST_WORDS=[W.MAN,W.SM,W.CONT,W.FILES,W.FILE,W.DIR];

// ---------- הפרטים ----------
// g — קבוצה (אחד מתוך); val — יש ערך: num · text · file; txt — ההסבר בתפריט
function flag(he,en,alts,txt){return {txt:txt,write:(v,lang)=>lang==='en'&&en?en:he,
  read:t=>[he].concat(en?[en]:[],alts||[]).some(a=>a.toUpperCase()===t.toUpperCase())?'':undefined};}
function valsw(he,val,ph,suffix,txt){return {val:val,ph:ph,txt:txt,write:v=>he+qv(String(v))+(suffix||''),
  read:t=>{if(!t.startsWith(he))return undefined;let v=t.slice(he.length);if(suffix&&v.endsWith(suffix))v=v.slice(0,-suffix.length);return v;}};}
function grp(o,g,txt){o.g=g;if(txt)o.txt=txt;return o;}
const DETS={
  'הכל':flag('/עמוק','/S',['/מסלול'],'כולל מה שבתוך התיקיות (מרשימה — עם המסלול המלא)'),
  'גם אם לא ריקה':flag('/עמוק','/S',[],'גם תיקייה שיש בה קבצים (לסל)'),
  'נסתרים':flag('/נסתרים','/A:H',['/A','/A:'],'גם קבצים נסתרים'),
  'אם תפוס לשאול':grp(flag('/תפוס:לשאול','/-Y'),'taken'),
  'אם תפוס לדלג':grp(flag('/תפוס:לדלג'),'taken'),
  'אם תפוס להחליף':grp(flag('/תפוס:להחליף','/Y'),'taken'),
  'אם תפוס לעצור':grp(flag('/תפוס:לעצור'),'taken'),
  // מ0.40: שם תפוס — בשם אחר; קובץ שיש ביעד זהה לו — נשאר במקומו
  'אם תפוס לשנות-שם':grp(flag('/תפוס:לשנות-שם'),'taken','בשם אחר (2); ואם יש ביעד קובץ זהה לו — נשאר במקומו'),
  'מהיום':grp(flag('/תאריך:יום'),'date','רק מה שהשתנה היום'),
  'מהשבוע':grp(flag('/תאריך:שבוע'),'date','רק מה שהשתנה השבוע'),
  'מהחודש':grp(flag('/תאריך:חודש'),'date','רק מה שהשתנה החודש'),
  'מהשנה':grp(flag('/תאריך:שנה'),'date','רק מה שהשתנה השנה'),
  'תאריך אחר':grp(valsw('/תאריך:','text','למשל: 3 ימים · <1.1.2026'),'date','תאריך שכותבים'),
  'גודל':valsw('/גודל:','text','למשל: >10MB',null,'רק קבצים לפי גודל'),
  'מכיל בקובץ':valsw('/מכיל:','text','טקסט',null,'רק קבצים שהטקסט כתוב בהם'),   // מ0.40
  'בלי לפתוח':flag('/בלי-לפתוח',null,[],'יוצר, ולא פותח את הרשימה בסוף ההרצה'),   // מ0.40
  'עד אחוז':valsw('/עד:','num','אחוז','%','אחרי השווה: עוצר אם השורה מוציאה יותר מהאחוז הזה'),
  'יומן':valsw('/יומן:','file','קובץ',null,'כל קובץ שהגיע נרשם בקובץ טקסט'),
  'מצב לפי זמן':valsw('/מצב:','text','תאריך, או תאריך ושעה',null,'המקור הוא גיבוי: נכתב המצב של אותו זמן'),
  'תנאים':flag('/תנאים',null,[],'משווה גם את התנאים של שתי החכמות'),
  'הוסף בסוף':flag('/הוסף',null,[],'מוסיף בסוף הקובץ, ולא מחליף את מה שהיה'),
  'עמוק':{txt:'בדיקה מלאה של הכונן',word:true,write:()=>'עמוק',read:t=>t==='עמוק'?'':undefined},
  'קיים':{g:'ex',word:true,write:(v,l,c)=>c&&c.fem?'קיימת':'קיים',read:t=>t==='קיים'||t==='קיימת'?'':undefined},
  'חסר':{g:'ex',word:true,write:(v,l,c)=>c&&c.fem?'חסרה':'חסר',read:t=>t==='חסר'||t==='חסרה'?'':undefined},
  'מכיל':{val:'text',ph:'טקסט',txt:'הקובץ מכיל את הטקסט',write:v=>'מכיל '+q(v)},
  'קבצים':valsw('/קבצים:','num','מספר',null,'כמה קבצים בתיקייה (בלי תתי־תיקיות)'),
  'רשימות':valsw('/רשימות:','num','מספר',null,'כמה רשימות יש בה'),
  'פריטים':valsw('/פריטים:','num','מספר',null,'כמה פריטים יש בה'),
  'מיון':{val:'text',ph:'למשל: שם',txt:'סדר התצוגה',word:true,write:v=>'מיון:'+qv(v),read:t=>t.startsWith('מיון:')?t.slice(5):undefined},
  'עד זמן':valsw('/עד:','text','למשל: 30שניות',null,'עוצר כשסבב אחד לקח יותר'),
  'בלי עצירה':{txt:'ממשיך גם אחרי כל כישלון (עלול לתקוע)',write:()=>''}
};
const GROUP_TITLE={taken:'אם הקובץ כבר קיים ביעד',date:'לפי תאריך שינוי',ex:'מה לוודא'};
const TAKEN=['אם תפוס לשאול','אם תפוס לדלג','אם תפוס להחליף','אם תפוס לעצור','אם תפוס לשנות-שם'];
// מה שרק מ0.40 מכיר — בגרסה הקודמת לא מוצע
const NEW040=['אם תפוס לשנות-שם','מכיל בקובץ','בלי לפתוח'];
const DATES=['מהיום','מהשבוע','מהחודש','מהשנה','תאריך אחר'];
const TRANSFER=['הכל','נסתרים'].concat(TAKEN,DATES,['גודל','מכיל בקובץ','עד אחוז','יומן']);

// ---------- סוגי הבחירה (בבורר) ----------
// מה הבורר מציע במקום. place — מסלול בכונן; list / smart — רשימה; expfile — קובץ רשימה (יצוא / ייבוא)
const PICK={
  folder:{label:'תיקייה',v:'place'},
  file:{label:'קובץ',v:'place'},
  home:{label:'הבית של התוכנה',v:'place'},
  listfiles:{label:'הקבצים שברשימה',v:'list',files:true},
  list:{label:'רשימה',v:'list'},
  content:{label:'מה שבתוך רשימה',v:'list',content:true},
  smartfiles:{label:'הקבצים שרשימה חכמה מוצאת',v:'smart',files:true},
  smart:{label:'רשימה חכמה',v:'smart'},
  impfile:{label:'קובץ רשימה (ייבוא)',v:'expfile'},
  expfile:{label:'קובץ רשימה (יצוא)',v:'expfile'},
  cmdfile:{label:'קובץ פקודות',v:'place'},
  outfile:{label:'קובץ',v:'place'},
  htmlfile:{label:'עמוד מעבדה (html)',v:'place'}
};
const PLACE_PICKS=['folder','file','home','cmdfile','outfile','htmlfile'];
function pickOf(v){
  if(!v)return [];
  if(v.kind==='place')return PLACE_PICKS;
  if(v.kind==='list')return [v.files?'listfiles':v.content?'content':'list'];
  if(v.kind==='smart')return [v.files?'smartfiles':'smart'];

function tokenize(s){
  const out=[];let i=0;

      m.vals[0]={kind:'name',raw:p.pop()};m.vals[1]=p.length?{kind:'list',raw:p.join('/')}:null;return m;}
    case 'smart':{const r=takeSort(m,takeNoOpen(m,rest));const nr=nameAndRest(r);if(!nr[0]||!nr[1])return null;
      m.vals[0]=hit.id==='עדכן רשימה חכמה'?{kind:'smart',raw:nr[0]}:{kind:'name',raw:nr[0]};m.vals[1]={kind:'cond',raw:nr[1]};return m;}
    case 'note':{const nr=nameAndRest(rest);if(!nr[0])return null;m.vals[0]={kind:'text',raw:nr[0]};m.vals[1]=nr[1]?{kind:'list',raw:unq(nr[1])}:null;return m;}
    case 'find':{const r=takeSort(m,rest);if(!r)return null;m.vals[0]={kind:'cond',raw:r};return m;}
    case 'open':{const r=unq(def.det.length?takeSort(m,rest):rest);if(!r)return null;
      m.vals[0]=hit.id==='פתח רשימה חכמה'?{kind:'smart',raw:r}:hit.id==='פתח תיקייה'?{kind:'place',raw:r}:{kind:'list',raw:r};return m;}
    case 'screen':{const sc=ALL_SCREENS.slice().sort((a,b)=>b.length-a.length).find(x=>rest===x||rest.startsWith(x+' '));if(!sc)return null;
      if(sc==='מעבדה'||sc==='תוספים'){const a=unq(rest.slice(sc.length));const p=blank('פתח תוסף');p.vals[0]=a?{kind:'text',raw:a}:null;return p;}
      m.vals[0]={kind:'word',raw:sc};const a=unq(rest.slice(sc.length));m.vals[1]=a?{kind:'place',raw:a}:null;return m;}
    case 'plugin':{const a=unq(rest);m.vals[0]=a?{kind:'text',raw:a}:null;return m;}
    case 'tool':{const nr=nameAndRest(rest);if(TOOLS.indexOf(nr[0])<0)return null;m.vals[0]={kind:'word',raw:nr[0]};m.vals[1]=nr[1]?{kind:'text',raw:nr[1]}:null;return m;}
    case 'run':{const r=unq(rest);if(!r)return null;m.vals[0]={kind:'place',raw:r};return m;}
    case 'add':{if(ADDS.indexOf(rest)<0)return null;m.vals[0]={kind:'word',raw:rest};return m;}
  }
  // הצורה הכללית: מקומות (עם מילות סוג), ופרטים בכל מקום בשורה
  const vals=[];
  for(let i=n;i<tk.length;i++){
    const t=tk[i];
    if(t.raw[0]==='/'){
      if(def.form==='comp'&&t.t.startsWith('/רשימה:')){vals.unshift({kind:'list',raw:t.t.slice(7),viaSwitch:true});continue;}
      const d=readDet(def,t.t);if(!d)return null;addDet(m.dets,d);continue;
    }
    if(!t.q){
      if(t.t==='מכיל'&&def.det.indexOf('מכיל')>=0&&tk[i+1]){addDet(m.dets,{d:'מכיל',v:tk[i+1].t});i++;continue;}
      const wd=def.det.find(id=>DETS[id].word&&!DETS[id].val&&DETS[id].read(t.t)!==undefined);
      if(wd){addDet(m.dets,{d:wd});continue;}
      if(LIST_WORDS.indexOf(t.t)>=0){
        let content=false,files=false,kind=null;
        while(i<tk.length&&!tk[i].q&&LIST_WORDS.indexOf(tk[i].t)>=0){const w=tk[i].t;if(w===W.CONT)content=true;else if(w===W.FILES)files=true;else kind=w;i++;}
        if(i>=tk.length)return null;
        const nm=tk[i].t;
        if(kind===W.MAN)vals.push({kind:'list',raw:nm,files:files,content:content});
        else if(kind===W.SM&&!content)vals.push({kind:'smart',raw:nm,files:files});
        else if(kind===W.FILE&&!files&&!content)vals.push({kind:'expfile',raw:nm});
        else if(kind===W.DIR&&!files&&!content)vals.push({kind:'place',raw:nm});
        else return null;
        continue;
      }
    }
    vals.push({kind:'plain',raw:t.t});
  }
  let cmd=hit.id;
  const anyList=vals.some(v=>v.kind==='list'||v.kind==='smart'||v.kind==='expfile');
  if(def.rd)cmd=anyList?'בטל':'מחק תיקייה';
  if(hit.id==='צור תיקייה'&&anyList){
    if(vals.length!==1||vals[0].kind!=='list'||vals[0].files||vals[0].content||m.dets.length)return null;
    const p=vals[0].raw.replace(/\\/g,'/').split('/').filter(Boolean);
    return {cmd:'צור רשימה',vals:[{kind:'name',raw:p.pop()},p.length?{kind:'list',raw:p.join('/')}:null],dets:[]};
  }
  const d2=CMDS[cmd];m.cmd=cmd;
  if(cmd!==hit.id){m.dets=m.dets.map(x=>x.d==='הכל'&&d2.det.indexOf('גם אם לא ריקה')>=0?{d:'גם אם לא ריקה'}:x);
    if(m.dets.some(x=>d2.det.indexOf(x.d)<0))return null;}
  if(d2.form==='md'){
    if(vals.length>1||(vals[0]&&vals[0].kind!=='plain'))return null;
    if(vals[0]){const p=vals[0].raw,c=Math.max(p.lastIndexOf('\\'),p.lastIndexOf('/'));
      m.vals=[{kind:'name',raw:c>=0?p.slice(c+1):p},c>=0?{kind:'place',raw:p.slice(0,c)}:null];}
    else m.vals=[null,null];
    return m;
  }
  if(vals.length>d2.slots.length)return null;
  m.vals=[];
  for(let k=0;k<d2.slots.length;k++){
    const v=vals[k]||null,sl=d2.slots[k];
    if(!v){m.vals.push(null);continue;}
    const f=fitVal(sl,v);if(!f)return null;
    m.vals.push(f);
  }
  return m;
}
function fromLoop(rest){
  const m=blank('לולאה');const tk=tokenize(rest);
  if(!tk.length||!/^\d+$/.test(tk[0].t))return null;
  m.vals[0]={kind:'num',raw:tk[0].t};
  for(let i=1;i<tk.length;i++){const d=readDet(CMDS['לולאה'],tk[i].t);if(!d)return null;m.dets.push(d);}
  return m;
}
/** ערך שנקרא ← המקום (null — לא מתאים) */
function fitVal(sl,v){
  if(sl.kind==='name'||sl.kind==='text'||sl.kind==='cond')return v.kind==='plain'?{kind:sl.kind,raw:v.raw}:null;
  if(sl.kind==='num')return v.kind==='plain'&&/^\d+$/.test(v.raw)?{kind:'num',raw:v.raw}:null;
  if(sl.kind==='word')return v.kind==='plain'?{kind:'word',raw:v.raw}:null;
  if(sl.kind==='mode')return v.kind==='plain'?{kind:'mode',raw:v.raw}:null;
  if(sl.kind==='pick'){
    const val=v.kind==='plain'?{kind:'place',raw:v.raw}:Object.assign({},v);
    if(val.kind==='place'&&val.raw==='%בית%')val.is='home';
    return pickOf(val).some(p=>sl.pk.indexOf(p)>=0)?val:null;
  }
  return null;
}
function addDet(a,d){const g=DETS[d.d].g;for(let i=a.length-1;i>=0;i--)if(a[i].d===d.d||(g&&DETS[a[i].d].g===g))a.splice(i,1);a.push(d);}

// ---------- כתיבה ----------
const listPath=raw=>String(raw).replace(/\\/g,'/');
function word(m,lang){const def=CMDS[m.cmd];if(lang==='en'&&def.en)return def.en;return typeof def.w==='function'?def.w(m):def.w;}
function valOut(v){
  if(v.kind==='list')return (v.content?W.CONT+' ':'')+(v.files?W.FILES+' ':'')+W.MAN+' '+q(listPath(v.raw));
  if(v.kind==='smart')return (v.files?W.FILES+' ':'')+W.SM+' '+q(listPath(v.raw));
  if(v.kind==='expfile')return W.FILE+' '+q(v.raw);
  if(v.kind==='num'||v.kind==='word'||v.kind==='cond')return String(v.raw);
  return q(v.raw);
}
function detsOut(m,lang){
  const fem=m.cmd==='ודא'&&m.vals&&m.vals[0]&&(m.vals[0].kind==='list'||m.vals[0].kind==='smart');
  return m.dets.filter(d=>CMDS[m.cmd].det.indexOf(d.d)>=0).map(d=>DETS[d.d].write(d.v,lang,{fem:fem})).filter(Boolean);
}
const has=v=>v&&String(v.raw).trim()!=='';
/** מבנה ← שורה בתחביר שהמנוע מכיר */
function toLine(m,lang){
  if(!m.cmd)return (m.typing||'').trim();
  const def=CMDS[m.cmd],w=word(m,lang),v=m.vals||[];
  if(def.text)return (w+' '+(m.text||'')).trimEnd();
  const parts=[w];
  switch(def.form){
    case 'fixed':case 'back':return w;
    case 'loop':if(has(v[0]))parts.push(v[0].raw);return parts.concat(detsOut(m,lang)).join(' ');
    case 'measure':return parts.concat(detsOut(m,lang)).join(' ');
    case 'cont':if(m.dets.some(d=>d.d==='בלי עצירה'))return w+' ()';return has(v[0])?w+' ('+v[0].raw+')':w;
    case 'md':{const nm=v[0],p=v[1];if(has(nm)&&has(p))parts.push(q(p.raw+'\\'+nm.raw));else if(has(p))parts.push(q(p.raw+'\\'));return parts.join(' ');}
    case 'mklist':{if(has(v[0]))parts.push(q((has(v[1])?listPath(v[1].raw)+'/':'')+v[0].raw));return parts.concat(has(v[0])?detsOut(m,lang):[]).join(' ');}
    case 'smart':if(has(v[0]))parts.push(q(v[0].raw));if(has(v[1]))parts.push(v[1].raw);return parts.concat(detsOut(m,lang)).join(' ');
    case 'note':if(has(v[0]))parts.push(q(v[0].raw));if(has(v[1]))parts.push(q(listPath(v[1].raw)));return parts.join(' ');
    case 'find':if(has(v[0]))parts.push(v[0].raw);return parts.concat(detsOut(m,lang)).join(' ');
    case 'open':if(has(v[0]))parts.push(q(v[0].kind==='place'?v[0].raw:listPath(v[0].raw)));return parts.concat(detsOut(m,lang)).join(' ');
    case 'screen':if(has(v[0]))parts.push(v[0].raw);if(has(v[0])&&has(v[1]))parts.push(q(v[1].raw));return parts.join(' ');
    case 'plugin':if(has(v[0]))parts.push(q(v[0].raw));return parts.join(' ');
    case 'tool':if(has(v[0]))parts.push(v[0].raw);if(has(v[0])&&has(v[1]))parts.push(v[1].raw);return parts.join(' ');
    case 'run':case 'add':if(has(v[0]))parts.push(v[0].kind==='word'?v[0].raw:q(v[0].raw));return parts.join(' ');
    case 'comp':
      if(has(v[0])&&has(v[1])&&v[0].kind==='list'&&!v[0].files&&!v[0].content&&v[1].kind==='place'){
        parts.push('/רשימה:'+q(listPath(v[0].raw)),q(v[1].raw));return parts.concat(detsOut(m,lang)).join(' ');}
  }
  for(let k=0;k<def.slots.length;k++){const x=v[k];if(!has(x))break;parts.push(valOut(x));}
  return parts.concat(detsOut(m,lang)).join(' ');
}

// ---------- מה מותר ----------
const isL=x=>x&&(x.kind==='list'||x.kind==='smart'||x.kind==='expfile');
/** מה הבורר מציע במקום k, לפי מה שכבר נבחר (כמו המנוע: מה שלא יעבוד — לא מוצע) */
function pickKinds(m,k){
  const def=CMDS[m.cmd],sl=def.slots[k],v=m.vals||[];
  let pk=sl.pk.slice();
  if(sl.pk040&&!compat.plugins)pk=pk.filter(p=>sl.pk040.indexOf(p)<0);   // הגרסה הקודמת לא מעבירה מרשימה לתיקייה
  const s=v[0],src=s?pickOf(s):[];
  if(m.cmd==='העתק'&&k===1&&s){
    if(src.indexOf('folder')>=0)pk=['folder','list'];
    else if(src[0]==='listfiles')pk=['folder','list','expfile'];
    else if(src[0]==='smartfiles')pk=['folder','list'];
    else if(src[0]==='list')pk=['list','expfile'];
    else pk=['list'];
  }
  if(m.cmd==='העבר'&&k===1&&s)pk=(s.kind==='list'||s.kind==='smart')&&!s.files?['list']:['folder'];   // מ0.40: קבצי רשימה — לתיקייה
  if(m.cmd==='השווה'&&k===1&&s){
    if(s.kind==='place')pk=['folder'];
    else if(s.kind==='list'&&!s.files&&!s.content)pk=['folder','list','smart','listfiles','smartfiles'];
    else pk=['list','smart','listfiles','smartfiles'];
  }
  return pk;
}
/** הפרטים שמתאימים למה שנבחר. המנוע: סינון — לא על רשימות; ליעד שהוא רשימה — אין פרטים */
function allowed(m){
  return allowed0(m).filter(x=>compat.plugins||NEW040.indexOf(x)<0);
}
function allowed0(m){
  const def=CMDS[m.cmd];if(!def||def.text)return [];
  const v=m.vals||[],ok=def.det;
  if(m.cmd==='העתק'||m.cmd==='העבר'){
    if(isL(v[1]))return [];
    if(isL(v[0]))return ok.filter(x=>x==='הכל'||x==='מכיל בקובץ'||DETS[x].g==='taken');
    // מ0.40: מתג שלא שייך — שגיאה במנוע. "עד אחוז" — רק למה שההשוואה מצאה; ושם אין סינון ואין "מצב לפי זמן"
    const cmp=v[0]&&/^%רק-(במקור|ביעד)%$/.test(String(v[0].raw||'').trim());
    if(cmp)return ok.filter(x=>x==='עד אחוז'||x==='יומן'||DETS[x].g==='taken');
    return ok.filter(x=>x!=='עד אחוז');
  }
  if(m.cmd==='מחק')return isL(v[0])?[]:ok;
  if(m.cmd==='השווה'){
    if(isL(v[0])||isL(v[1]))return v[0]&&v[1]&&v[0].kind==='smart'&&!v[0].files&&v[1].kind==='smart'&&!v[1].files?['תנאים']:[];
    return ['נסתרים'];
  }
  if(m.cmd==='ודא'){
    const t=v[0];
    if(isL(t))return ['קיים','חסר','רשימות','פריטים'];
    if(t&&t.is==='file')return ['קיים','חסר','מכיל'];
    if(t&&t.is==='folder')return ['קיים','חסר','קבצים'];
    return ['קיים','חסר','מכיל','קבצים'];
  }
  return ok;
}
/** לא משאירים דבר לא תקין: פרט שכבר לא מתאים — יורד; מחזיר מה ירד */
function prune(m){
  if(!m||!m.cmd||CMDS[m.cmd].text)return [];
  const ok=allowed(m),gone=m.dets.filter(d=>ok.indexOf(d.d)<0).map(d=>d.d);
  if(gone.length)m.dets=m.dets.filter(d=>ok.indexOf(d.d)>=0);
  return gone;
}
/** מקום שנבחר בו משהו שכבר לא מתאים (אחרי החלפת המקור) — מתרוקן; מחזיר את מילות הקישור שהתרוקנו */
function pruneVals(m){
  const def=CMDS[m.cmd];if(!def||def.text)return [];
  const out=[];
  def.slots.forEach((sl,k)=>{const v=m.vals[k];if(sl.kind!=='pick'||!v||!has(v))return;
    const pk=pickKinds(m,k);if(!pickOf(v).some(p=>pk.indexOf(p)>=0)){m.vals[k]=null;out.push(sl.link||'מקום');}});
  return out;
}
function missing(m){
  if(!m||!m.cmd)return [];
  const def=CMDS[m.cmd];if(def.text)return [];
  const out=[];
  def.slots.forEach((sl,k)=>{if(sl.opt||sl.kind==='screenarg')return;const v=m.vals[k];if(!has(v))out.push((sl.link?sl.link+' ':'')+(sl.label||'בורר'));});
  return out;
}
/** מה שמוצג בשורה סגורה: אותן מילים כמו בשורה הפתוחה (בקובץ — התחביר של המנוע) */
function shown(v){
  const path=s=>String(s).replace(/\\/g,' \\ ').replace(/^%([^%]+)%/,'$1');
  if(v.kind==='list')return {kl:v.files?'הקבצים שברשימה':v.content?'מה שבתוך רשימה':'רשימה',t:listPath(v.raw).replace(/\//g,' › ')};
  if(v.kind==='smart')return {kl:v.files?'הקבצים של חכמה':'רשימה חכמה',t:listPath(v.raw).replace(/\//g,' › ')};
  if(v.kind==='expfile')return {kl:'קובץ רשימה',t:path(v.raw)};
  if(v.kind==='place')return {kl:'',t:v.raw==='%בית%'?'הבית':path(v.raw)};
  return {kl:'',t:String(v.raw)};
}
function parts(m,lang){
  const def=CMDS[m.cmd],out=[{c:'w',t:word(m,lang)}];
  if(def.text){out.push({c:'',t:m.text||''});return out;}
  def.slots.forEach((sl,k)=>{const v=m.vals[k];if(!has(v))return;const s=shown(v);
    if(sl.link)out.push({c:'lk',t:sl.link});out.push({c:'',t:(s.kl&&def.form!=='open'?s.kl+' ':'')+s.t});});   // "פתח רשימה" — כבר אומרת שזו רשימה
  m.dets.forEach(d=>out.push({c:'dt',t:'· '+d.d+(d.v!=null&&d.v!==''?' '+d.v:'')}));
  return out;
}
return {compat:compat,screens:screens,CMDS:CMDS,DETS:DETS,PICK:PICK,MENU:MENU,menu:menu,TOOLS:TOOLS,ADDS:ADDS,GROUP_TITLE:GROUP_TITLE,
  fromLine:fromLine,toLine:toLine,blank:blank,allowed:allowed,prune:prune,pruneVals:pruneVals,missing:missing,
  pickKinds:pickKinds,pickOf:pickOf,addDet:addDet,shown:shown,parts:parts,word:word,has:has,listPath:listPath};
})();
</script>

<script>
(function(){
"use strict";
const Mo=window.VfmEditorModel,CMDS=Mo.CMDS,DETS=Mo.DETS;
// ---------- הגשר לתוכנה (בדפדפן רגיל — דוגמה, לבדיקה) ----------
const pending={};let seq=0;
window.vfmResult=function(id,v){const cb=pending[id];delete pending[id];if(cb)cb(v);};
const V=window.vfm||demoBridge();
const can=n=>typeof V[n]==='function';
Mo.compat.plugins=can('runFile');            // מ0.40 ומעלה
function ask(method,args,cb){const id='r'+(++seq);pending[id]=cb;V[method].apply(V,[id].concat(args));}
function J(s,d){try{return s==null?d:JSON.parse(s);}catch(e){return d;}}
function pref(k,d){try{const v=V.load(k);return v==null?d:v;}catch(e){return d;}}
function setPref(k,v){try{V.save(k,v);}catch(e){}}
/** "הפקודות שלי" (מ0.40), ובגרסה הקודמת — תיקיית הקיצורים */
function myFiles(){return J(can('myCommands')?V.myCommands():V.commandFiles(),[]);}

// ---------- המצב ----------
let file=null, lines=[], models=[], saved='', act=-1, M=null, sh=null, lastInput=null, snap=null;
let hist=[{t:'',l:''}], hpos=0, histT=null;   // גרסה 10: ביטול וחזרה — הטקסט והשפה
let lang=pref('lang','he')==='en'?'en':'he', view=pref('view','inter')==='plain'?'plain':'inter', real=false;
const $=id=>document.getElementById(id);
const ed=$('ed'),plain=$('plain'),keys=$('keys'),addrow=$('addrow'),sheet=$('sheet'),sheetIn=$('sheetIn'),shade=$('shade');
const fname=$('fname'),runBtn=$('run'),runMode=$('runMode'),undoBtn=$('undo'),redoBtn=$('redo');

function text(){if(view==='plain'&&file)return plain.value.replace(/\r/g,'')+(plain.value&&!plain.value.endsWith('\n')?'\n':'');return lines.join('\n')+(lines.length?'\n':'');}
function dirty(){return file&&text()!==saved;}
function commit(){if(act>=0&&M&&JSON.stringify(M)!==snap){lines[act]=Mo.toLine(M,lang);models[act]=JSON.parse(JSON.stringify(M));}upd();}   // שורה שרק נפתחה — נשארת כמו שנכתבה
function upd(){
  // גרסה 10 — המשתמש: "צריך במקום מרוכז וברור פתיחת קובץ, סגירה, שמירה בשם"; השמירה — "מספיק בתפריט". קובץ שלא נשמר — נקודה ליד השם
  fname.textContent='';
  fname.append(E('span','hb','☰'),E('span','nm',file?file.name.replace(/\.vbat$/,''):'בחירת קובץ פקודות'));
  if(dirty()){const d=E('span','dot','●');d.setAttribute('aria-label','לא נשמר');fname.append(d);}
  runBtn.textContent=real?'▶ אמיתית':'▶ בכאילו';runBtn.classList.toggle('real',real);runMode.classList.toggle('real',real);
  histLater();updUndo();
}
function seg(id,v){[...$(id).querySelectorAll('button')].forEach(b=>{const on=b.dataset.v===v;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));});}
function parseAll(content){
  lines=content.split('\n');if(lines.length&&lines[lines.length-1]==='')lines.pop();
  models=lines.map(Mo.fromLine);act=-1;M=null;
  const fixed=[];
  models.forEach((m,i)=>{const g=Mo.prune(m);if(g.length){lines[i]=Mo.toLine(m,lang);fixed.push((i+1)+': '+g.join(', '));}});
  return fixed;
}
function load(f,content){
  file=f;saved=content==null?'':content.replace(/\r/g,'');
  const fixed=parseAll(saved);
  setPref('file',f.path||f.name);
  if(view==='plain')plain.value=text();
  draw();histReset();
  if(fixed.length)openSheet({kind:'fixed',list:fixed});

function save(then){
  commit();if(!file)return;
  if(view==='plain')parseAll(text());
  const t=text();
  if(can('saveCommandFile')){                                       // מ0.40
    const r=V.saveCommandFile(file.path||file.name,t,!!file.path);
    if(r==='exists'){openSheet({kind:'exists',name:file.name,then:then});return;}
    if(r){toast(r);return;}
  }else{
    const inMine=!file.path||V.commandFiles&&J(V.commandFiles(),[]).some(f=>f.path===file.path);
    if(!inMine){openSheet({kind:'oldsave',then:then});return;}
    if(!file.path&&J(V.commandFiles(),[]).some(f=>f.name===file.name)){openSheet({kind:'exists',name:file.name,then:then,old:true});return;}
    const r=V.writeCommandFile(file.name,t);if(r){toast(r);return;}
  }
  saved=t;
  if(!file.path){const f=myFiles().concat(J(V.commandFiles(),[])).find(x=>x.name===file.name);if(f)file.path=f.path;}
  upd();toast('נשמר');if(then)then();
}
function saveAs(name,then){
  const was=file;file={name:name.endsWith('.vbat')?name:name+'.vbat',path:null};

    const r=V.saveCommandFile(file.name,t,false);
    if(r==='exists'){file=was;openSheet({kind:'exists',name:name+'.vbat',then:then,asNew:true});return;}
    if(r){file=was;toast(r);return;}
  }else{
    if(J(V.commandFiles(),[]).some(f=>f.name===file.name)){file=was;openSheet({kind:'exists',name:file.name,then:then,old:true,asNew:true});return;}
    const r=V.writeCommandFile(file.name,t);if(r){file=was;toast(r);return;}
  }
  saved=t;const f=myFiles().concat(J(V.commandFiles(),[])).find(x=>x.name===file.name);if(f)file.path=f.path;
  setPref('file',file.path||file.name);upd();toast('נשמר בשם "'+file.name.replace(/\.vbat$/,'')+'"');if(then)then();
}

function replaceCmd(k){
  const old=M,def=CMDS[k],m=Mo.blank(k),dropped=[];
  if(def.text)m.text=old.text||'';
  else if(!CMDS[old.cmd].text){
    const pool=(old.vals||[]).filter(Mo.has);
    def.slots.forEach((sl,j)=>{
      const i=pool.findIndex(v=>sl.kind==='pick'?Mo.pickOf(v).some(p=>sl.pk.indexOf(p)>=0):(sl.kind===v.kind||(['name','text'].indexOf(sl.kind)>=0&&['name','text'].indexOf(v.kind)>=0)));
      if(i>=0){m.vals[j]=Object.assign({},pool[i]);if(sl.kind==='name'||sl.kind==='text')m.vals[j].kind=sl.kind;pool.splice(i,1);}
    });
    (old.dets||[]).forEach(d=>{if(def.det.indexOf(d.d)>=0)Mo.addDet(m.dets,d);else dropped.push(d.d);});
  }
  const loopEnd=old.cmd==='לולאה'?pairOf(act):-1;
  M=m;Mo.pruneVals(M);const g=Mo.prune(M);commit();
  if(loopEnd>=0&&k!=='לולאה'){lines.splice(loopEnd,1);models.splice(loopEnd,1);dropped.push('שורת "סוף"');}
  if(k==='לולאה'&&pairOf(act)<0){lines.splice(act+1,0,'סוף');models.splice(act+1,0,Mo.blank('סוף'));}
  closeSheet();
  const all=dropped.concat(g);if(all.length)toast('ירד, לא מתאים ל"'+k+'": '+all.join(', '));
}

// המשתמש: "בפתיחת קובץ היה עדיף שיביא את כל התיקיות שיש בהם קבצי פקודות, ומתוכם יבחר ויפתח" · "הפקודות שלי" בראש ·
// "כאשר בוחרים פתיחת קובץ נעשה רענון מהיר". כל התיקיות במכשיר — מהאינדקס, דרך findFiles בגשר (גרסת התוכנה הבאה):
// מחזירה מיד את מה שבאינדקס, ואחרי הרענון המהיר — שוב, ב־vfmResult. עד אז — התיקיות שהעורך מכיר.
function when(t){
  if(!t)return '';const d=new Date(+t),n=new Date(),p=x=>String(x).padStart(2,'0');
  const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime(),diff=Math.round((day(n)-day(d))/864e5);
  if(diff===0)return 'היום '+p(d.getHours())+':'+p(d.getMinutes());
  if(diff===1)return 'אתמול';
  return d.getDate()+'.'+(d.getMonth()+1)+(d.getFullYear()!==n.getFullYear()?'.'+d.getFullYear():'');
}
function niceDir(p){let v=p;try{v=V.toVar(p)||p;}catch(e){}return String(v).replace(/%([^%\\/]+)%/g,'$1').replace(/^[\\/]+|[\\/]+$/g,'').replace(/[\\/]/g,' \\ ');}
function groupDirs(list){
  const by={};
  list.forEach(f=>{const p=String(f.path||'');const k=p.slice(0,p.lastIndexOf('/'));if(!k||!VBAT.test(p))return;(by[k]=by[k]||{})[p]={name:f.name||p.split('/').pop(),path:p,time:+f.time||0};});
  return Object.keys(by).map(k=>{const fs=Object.keys(by[k]).map(x=>by[k][x]),w=niceDir(k);
    return {name:w.split(' \\ ').pop()||k,where:w,files:fs,time:Math.max.apply(null,fs.map(f=>f.time))};}).sort((a,b)=>b.time-a.time);
}
function savedDirs(){return J(pref('dirs',null),[]);}
function rememberDir(p){const a=[p].concat(savedDirs().filter(x=>x!==p)).slice(0,12);setPref('dirs',JSON.stringify(a));}
function knownFiles(){
  const all=myFiles().concat(J(V.commandFiles(),[]));
  const dirs={};const addDir=p=>{if(p)dirs[String(p).replace(/\/$/,'')]=1;};
  all.forEach(f=>{const p=String(f.path||'');addDir(p.slice(0,p.lastIndexOf('/')));});
  J(V.places&&V.places(),[]).forEach(o=>{if(o.name==='הורדות')addDir(o.path);});
  savedDirs().forEach(addDir);
  if(file&&file.path)addDir(file.path.slice(0,file.path.lastIndexOf('/')));
  Object.keys(dirs).forEach(d=>{const fs=J(V.listDir(d),null);if(fs)fs.forEach(f=>{if(!f.dir&&VBAT.test(f.name))all.push({name:f.name,path:d+'/'+f.name,time:f.time});});});
  return all;
}
function countIn(g){return (g||[]).reduce((n,d)=>n+d.files.length,0);}
function gatherDirs(){
  if(can('findFiles')){
    const id='r'+(++seq);
    pending[id]=r=>{if(!sh||sh.kind!=='open')return;const was=countIn(sh.groups);sh.groups=groupDirs(J(r,[]));
      const n=countIn(sh.groups)-was;sh.status=n>0?'נוסף: '+n:'מעודכן';if(!sh.dir)drawSheet();};
    sh.status='מרענן…';
    return groupDirs(J(V.findFiles(id,'סוג:vbat',true),[]));
  }
  sh.status='התיקיות שהעורך מכיר. כל התיקיות במכשיר — עם גרסת התוכנה הבאה.';
  return groupDirs(knownFiles());
}
function drawOpen(){
  if(sh.dir){drawOpenDir();return;}
  if(!sh.groups)sh.groups=gatherDirs();
  top('פתיחה');
  if(sh.status)sheetIn.appendChild(E('div','status',sh.status));
  const box=E('div','items'),mine=myFiles();
  box.appendChild(B('it',[E('span',null,'★ הפקודות שלי'),E('span','k',mine.length+' ›')],()=>{sh.dir={name:'הפקודות שלי',where:'',files:mine};drawSheet();}));
  sh.groups.forEach(d=>{const t=E('span',null,d.name);if(d.where&&d.where!==d.name)t.appendChild(E('span','sub',d.where));
    box.appendChild(B('it',[t,E('span','k',d.files.length+' · '+when(d.time)+' ›')],()=>{sh.dir=d;drawSheet();}));});
  box.appendChild(B('it',[E('span',null,'📂 תיקייה אחרת…'),E('span','k','')],otherDir));
  sheetIn.appendChild(box);
}
function drawOpenDir(){
  const d=sh.dir;top(d.name);
  if(d.where&&d.where!==d.name)sheetIn.appendChild(E('div','crumb',d.where));
  const box=E('div','items');
  box.appendChild(B('it',[E('span',null,'חזרה'),E('span','k','‹')],()=>{sh.dir=null;drawSheet();}));
  d.files.slice().sort((a,b)=>b.time-a.time).forEach(f=>box.appendChild(B('it',[E('span',null,f.name.replace(/\.vbat$/i,'')),
    E('span','k',(file&&f.path===file.path?'✓ ':'')+when(f.time))],()=>openFile(f))));
  if(!d.files.length)box.appendChild(E('div','it','אין קובצי פקודות'));
  sheetIn.appendChild(box);
}
function otherDir(){
  hideSheet();
  ask('pickFolder',['פתיחה — תיקייה',false],p=>{
    if(!p){draw();return;}
    const fs=J(V.listDir(p),null);
    if(fs==null){toast('התיקייה לא נקראה');draw();return;}
    const dir=String(p).replace(/\/$/,''),hits=fs.filter(f=>!f.dir&&VBAT.test(f.name)).map(f=>({name:f.name,path:dir+'/'+f.name,time:f.time}));
    if(!hits.length){toast('אין בתיקייה הזו קובצי פקודות');draw();return;}
    rememberDir(dir);const w=niceDir(dir);
    openSheet({kind:'open',dir:{name:w.split(' \\ ').pop(),where:w,files:hits}});
  });
}
function drawFiles(){
  top('קובצי הפקודות');
  const fs=myFiles().sort((a,b)=>b.time-a.time);
  const box=E('div','items');
  box.appendChild(B('it',[E('span',null,'+ קובץ חדש'),E('span','k','')],()=>{sh={kind:'newfile'};drawSheet();}));
  box.appendChild(B('it',[E('span',null,'📂 קובץ מהכונן…'),E('span','k','')],()=>pickTyped('קובץ פקודות',VBAT,'קובצי פקודות',p=>openFile({name:p.split('/').pop(),path:p}))));
  if(file)box.appendChild(B('it',[E('span',null,'שמירה בשם…'),E('span','k','')],()=>{sh={kind:'newfile',saveAs:true};drawSheet();}));
  sheetIn.appendChild(box);
  if(fs.length>10){
    const f=E('input','fi wide');f.type='text';f.placeholder='סינון לפי שם';f.dir='auto';sheetIn.appendChild(f);
    f.addEventListener('input',()=>{const t=f.value.trim();[...list.children].forEach(b=>{b.hidden=!!t&&b.dataset.n.indexOf(t)<0;});});
  }
  sheetIn.appendChild(E('div','grp','הפקודות שלי'));
  const list=E('div','items');
  fs.forEach(f=>{const b=B('it',[E('span',null,f.name.replace(/\.vbat$/,'')),E('span','k',file&&f.path===file.path?'✓':'')],()=>openFile(f));b.dataset.n=f.name;list.appendChild(b);});
  if(!fs.length)list.appendChild(E('div','it','אין עדיין'));
  sheetIn.appendChild(list);
}
function openFile(f){
  const go=()=>{const c=V.readText(f.path);if(c==null){toast('הקובץ לא נקרא');draw();return;}hideSheet();load(f,c);};
  if(dirty()){openSheet({kind:'leave',then:go});return;}
  go();
}
function drawNewFile(){
  top(sh.saveAs?'שמירה בשם':'קובץ פקודות חדש');
  const f=E('input','fi wide');f.type='text';f.placeholder='שם הקובץ';f.dir='auto';
  f.addEventListener('input',()=>{const x=fixName(f.value);if(x!==f.value){f.value=x;toast(FIX_NAME);}});
  sheetIn.appendChild(f);
  const asSave=!!sh.saveAs,then=sh.then;
  sheetIn.appendChild(B('primary','בחירה',()=>{
    const n=f.value.trim();if(!n){toast('צריך שם');return;}
    if(asSave){hideSheet();commit();saveAs(n,then);draw();return;}
    if(myFiles().concat(J(V.commandFiles(),[])).some(x=>x.name===n+'.vbat')){toast('יש כבר קובץ בשם הזה');return;}
    const go=()=>{hideSheet();load({name:n+'.vbat',path:null},'');saved='\u0000';lines=[''];models=[{cmd:null,vals:[],dets:[],typing:''}];histReset();if(view==='plain'){plain.value='';draw();upd();}else activate(0);};
    if(dirty()){sh={kind:'leave',then:go};drawSheet();return;}go();
  }));
  setTimeout(()=>f.focus(),50);
}
function drawExists(){
  top('יש כבר קובץ בשם הזה');
  sheetIn.appendChild(E('div',null,'בתיקיית הפקודות כבר יש "'+sh.name.replace(/\.vbat$/,'')+'". להחליף אותו, או לשמור בשם אחר?'));
  const then=sh.then,old=sh.old,asNew=sh.asNew,name=sh.name;
  sheetIn.appendChild(B('primary','להחליף',()=>{hideSheet();
    if(asNew)file={name:name,path:null};
    const t=text();const r=old?V.writeCommandFile(file.name,t):V.saveCommandFile(file.name,t,true);
    if(r){toast(r);draw();return;}
    saved=t;const f=myFiles().concat(J(V.commandFiles(),[])).find(x=>x.name===file.name);if(f)file.path=f.path;setPref('file',file.path||file.name);
    draw();toast('הוחלף ונשמר');if(then)then();}));
  sheetIn.appendChild(B('secondary','שם אחר',()=>{sh={kind:'newfile',saveAs:true,then:then};drawSheet();}));
}
function drawOldSave(){
  top('שמירה');
  sheetIn.appendChild(E('div',null,'הקובץ נפתח מחוץ לתיקיית הפקודות. בגרסה המותקנת של התוכנה העמוד שומר רק לתיקיית הפקודות (בגרסה הבאה — גם במקום המקורי).'));
  const then=sh.then;
  sheetIn.appendChild(B('primary','שמירה בשם לתיקיית הפקודות',()=>{sh={kind:'newfile',saveAs:true,then:then};drawSheet();}));
}
function drawRaw(){
  top('שורה '+(sh.line+1));
  sheetIn.appendChild(E('div','pre',lines[sh.line]));
  sheetIn.appendChild(E('div','grp','את השורה הזו העורך האינטראקטיבי עוד לא מכיר. היא נשמרת כמו שהיא. לעריכה — תצוגה "רגילה" בתפריט ☰.'));
  const i=sh.line;
  sheetIn.appendChild(B('it danger','מחיקת השורה',()=>{hideSheet();lines.splice(i,1);models.splice(i,1);upd();draw();}));
}
function drawFixed(){
  top('תוקן בקובץ');
  sheetIn.appendChild(E('div',null,'בשורות האלה היו פרטים שלא מתאימים, והם ירדו (לא משאירים דבר לא תקין):'));
  sheetIn.appendChild(E('div','pre',sh.list.join('\n')));
  sheetIn.appendChild(E('div','grp','הקובץ עוד לא נשמר. "שמירה" — כך יישאר; "בטל" כאן רק סוגר את ההודעה.'));
  sheetIn.appendChild(B('primary','שמירה',()=>{hideSheet();save();draw();}));
}
function drawLeave(){
  const then=sh.then||(()=>V.close());
  top('לא נשמר');
  sheetIn.appendChild(E('div',null,'יש שינויים שלא נשמרו ב"'+file.name.replace(/\.vbat$/,'')+'".'));
  sheetIn.appendChild(B('primary','שמירה',()=>{hideSheet();save(then);}));
  sheetIn.appendChild(B('secondary','בלי שמירה',()=>{hideSheet();saved=text();then();}));
}
const VARS=[['הורדות','תיקיית ההורדות'],['פנימי','הזיכרון הפנימי'],['כרטיס','כרטיס הזיכרון'],['כאן','התיקייה של הקובץ'],['תאריך','התאריך והשעה עכשיו'],
  ['שעה','השעה עכשיו'],['ייחודי','מספר שלא חוזר'],['סבב','מספר הסבב בלולאה'],['רק-במקור','אחרי השווה: רק במקור'],['רק-ביעד','אחרי השווה: רק ביעד'],
  ['שיתוף','מה ששותף לתוכנה'],['בית','הבית של התוכנה (בהפעל)'],['מזהה-כרטיס','המזהה של כרטיס הזיכרון']];
function drawVars(){
  top('משתנה');
  const f=sh.target,box=E('div','items');
  VARS.forEach(([n,t])=>box.appendChild(B('it',[E('span',null,n),E('span','k',t)],()=>{hideSheet();if(f.isConnected){insertAt(f,'%'+n+'%');}else draw();})));
  sheetIn.appendChild(box);
}

// ---------- התחלה ----------
function theme(){
  const t=J(V.theme&&V.theme(),null);if(!t)return;
  const r=document.documentElement.style,set=(k,v)=>{if(v)r.setProperty(k,v);};
  set('--bg',t.bg);set('--soft',t.bgSoft);set('--fg',t.text);set('--muted',t.sub);set('--ghost',t.muted);set('--chip',t.bar);
  set('--chip-fg',t.accentDark);set('--accent',t.accent);set('--err',t.red);set('--rule',t.rule);set('--act',t.bgSoft);set('--on',t.onColor);
}
theme();
(function start(){
  const last=pref('file',null);
  if(last){
    const f0=myFiles().concat(J(V.commandFiles(),[])).find(f=>f.path===last||f.name===last);
    const f=f0||(last.startsWith('/')?{name:last.split('/').pop(),path:last}:null);
    if(f){const c=V.readText(f.path);if(c!=null){load(f,c);return;}}
  }
  draw();
})();

// ---------- דוגמה לבדיקה בדפדפן (בתוכנה — הגשר האמיתי) ----------
function demoBridge(){
  const files={'/k/גיבוי שבועי.vbat':'הערה גיבוי חודשי\nהעתק "%הורדות%\\חשבוניות" "%כרטיס%\\גיבוי" /עמוק\nמחק "%הורדות%\\זמני\\*.tmp" /נסתרים /תאריך:חודש\nפתח רשימה "עבודה"\nCOPY "%הורדות%\\הסכם.docx" "%כרטיס%"\nצור תיקייה "%כרטיס%\\גיבוי\\חדשה"\nחזור 3\nהודעה סבב %סבב%\nסוף\n:: הערה ישנה\n'};
  const store={};
  const later=(id,v)=>setTimeout(()=>window.vfmResult(id,v),30);
  const list=()=>JSON.stringify(Object.keys(files).map((p,i)=>({name:p.split('/').pop(),path:p,time:i})));
  return {
    theme:()=>null,load:k=>store[k]!=null?store[k]:(k==='file'?'/k/גיבוי שבועי.vbat':null),save:(k,v)=>{store[k]=v;},
    commandFiles:list,myCommands:list,
    readText:p=>files[p]==null?null:files[p],
    saveCommandFile:(p,t,rep)=>{const path=p.startsWith('/')?p:'/k/'+(p.endsWith('.vbat')?p:p+'.vbat');if(files[path]!=null&&!rep)return 'exists';files[path]=t;window.__saved=t;return '';},
    writeCommandFile:(n,t)=>{files['/k/'+n]=t;window.__saved=t;return '';},
    toVar:p=>p.replace(/^\/storage\/emulated\/0\/Download/,'%הורדות%').replace(/^\/storage\/1234-5678/,'%כרטיס%').replace(/\//g,'\\'),
    pickFolder:(id)=>later(id,'/storage/1234-5678/ארכיון'),
    listDir:p=>JSON.stringify([{name:'גיבוי.vbat',dir:false,size:10,time:2},{name:'תמונה.jpg',dir:false,size:10,time:3},{name:'ישן.vbat',dir:false,size:10,time:1},{name:'תת',dir:true,size:0,time:4},{name:'תוסף.html',dir:false,size:10,time:5}]),
    pickFile:(id)=>later(id,'/storage/emulated/0/Download/דוח.pdf'),
    pickList:(id)=>later(id,JSON.stringify({mode:'עבודה',path:'לקוחות\\פעילים'})),
    smartLists:()=>JSON.stringify(['חדשים','ספרים\\פדף']),modes:()=>JSON.stringify(['עבודה','בדיקות מערכת']),
    smartForm:(id,n,c,so)=>later(id,JSON.stringify({name:n||'מהטופס',cond:(c?c+' ':'')+'סוג:ספרים',sort:'תאריך',view:''})),
    runFile:(t,p,r)=>{window.__ran={text:t,path:p,real:r};},runCommands:t=>{window.__ran=t;},close:()=>{},toast:()=>{},log:()=>{}
  };
}
})();
