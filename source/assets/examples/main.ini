; קיצור דרך: ➕ במסך הבית ← "פקודה / קיצור דרך" — קיצורים מוכנים (סל, הגדרות, רשימה כסביבת עבודה…), קובץ פקודות קיים או פקודה חדשה, כאריח. למה: לרכז נושאים שאתה רוצה קרוב ומיידי.
; בעורך קובץ פקודות: הכפתורים "פתח…", "צלמית" ו"הדמיה" כותבים את השורות בשבילך.
[פונקציה: ט. תוכנות ופקודות בעברית]
מזהה = f-דוגמה-בית-9
סוג = וירטואלי
תיאור = קובץ פקודות עם צלמית — כאריח הוא תוכנה: צלמית, שם ו"למה", ונגיעה מריצה (📝 — מאחוריו קובץ טקסט); בכל מקום אחר — קובץ טקסט רגיל. הפעלים: פתח · צור · עדכן · מצא
רשימה = ט. תוכנות ופקודות בעברית

